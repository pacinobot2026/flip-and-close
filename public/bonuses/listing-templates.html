<div class="section"><div class="container">
<div class="eyebrow">Swipe File</div><h1>30 Auction Listing Templates</h1>
<p>Six domain types. Five templates each. Fill in the brackets and list. These apply the 7-element formula from Module 3.</p>
<div id="tabs" style="display:flex;gap:8px;flex-wrap:wrap;margin:24px 0;">
<button onclick="showTab(0)" id="tab-0" class="btn btn-blue" style="padding:8px 16px;font-size:.78rem;">Geo Domain</button><button onclick="showTab(1)" id="tab-1" class="btn btn-sm" style="padding:8px 16px;font-size:.78rem;background:#0f1623;border:1px solid rgba(255,255,255,.1);color:#94a3b8;">Exact-Match Keyword</button><button onclick="showTab(2)" id="tab-2" class="btn btn-sm" style="padding:8px 16px;font-size:.78rem;background:#0f1623;border:1px solid rgba(255,255,255,.1);color:#94a3b8;">Brandable</button><button onclick="showTab(3)" id="tab-3" class="btn btn-sm" style="padding:8px 16px;font-size:.78rem;background:#0f1623;border:1px solid rgba(255,255,255,.1);color:#94a3b8;">Numeric / Short</button><button onclick="showTab(4)" id="tab-4" class="btn btn-sm" style="padding:8px 16px;font-size:.78rem;background:#0f1623;border:1px solid rgba(255,255,255,.1);color:#94a3b8;">Expired / Aged</button><button onclick="showTab(5)" id="tab-5" class="btn btn-sm" style="padding:8px 16px;font-size:.78rem;background:#0f1623;border:1px solid rgba(255,255,255,.1);color:#94a3b8;">Acronym</button>
</div>
<div id="content"></div>
</div></div>
<script>
const TEMPLATES=[{"type":"Geo Domain","eg":"DenverPlumber.com","t":"[City][Trade].com — Established Local Service Domain","d":"Premium geo domain perfectly positioned for a [city]-based [trade] business. \"[City][Trade].com\" is the exact search term local customers use when looking for a [trade] in [City]. Domains of this format consistently rank in local search without paid ads. This is an exact-match domain — search engines treat the keyword in the domain as a strong relevance signal. Similar geo domains in this category have sold between $[low] and $[high]. Reserve is set below market to generate bidder activity. Auction closes [date]."},{"type":"Exact-Match Keyword","eg":"BestHomeLoans.com","t":"[Keyword].com — High Commercial Intent Keyword Domain","d":"\"[Keyword]\" receives [X] monthly searches with strong commercial intent. This exact-match .com domain gives the owner an immediate SEO and brand advantage in the [industry] space. Comparable keyword domains with similar search volume have sold at auction for $[range]. The reserve is deliberately set below comparable sales to create bidder competition. Acquisition by the right operator could produce significant organic traffic value."},{"type":"Brandable","eg":"Velora.com","t":"[Name].com — Short, Memorable Brand Domain — [Industry] Ready","d":"[Name].com is a clean, 6-character .com domain with no conflicting trademarks. It carries a [tone] sound — professional, memorable, and appropriate for [industry sectors]. Short brandable domains under 7 characters in clean .com format have sustained strong demand in secondary markets. This domain has no development history — clean slate for a new brand or product launch."},{"type":"Numeric / Short","eg":"247Pro.com","t":"[Numbers][Word].com — Numeric Pattern Domain","d":"Numeric domains with strong associative words have proven international appeal and are particularly valued in Asian markets where numeric patterns carry symbolic weight. \"[Numbers][Word].com\" is clean, short, and universally pronounceable. Comparable numeric-pattern .com domains sell consistently in the $[range] range. Reserve reflects market conditions."},{"type":"Expired / Aged","eg":"GardenTools.net","t":"Aged [Keyword].net — [X] Years Old — Established Domain History","d":"[Domain] was first registered in [year] — making it [X] years old with a documented registration history. Aged domains signal trust and longevity to search engines. This domain has no known penalty history and passes standard spam checks. Domain age is an underappreciated value factor. Reserve is set to reflect the age premium over comparable fresh registrations."},{"type":"Acronym","eg":"RELO.com","t":"[Acronym].com — Clean 4-Letter Acronym Domain","d":"4-letter .com domains are among the most consistently valued assets in the domain market. [ACRONYM] is a clean acronym with no conflicting trademarks and clear applicability to [industries]. Short acronym domains are finite in supply and have demonstrated sustained demand from brand builders and corporate acquirers. Comparable 4-letter .com domains trade in the $[range] range."}];
function showTab(i){
  document.querySelectorAll('#tabs button').forEach((b,j)=>{
    b.style.background=j===i?'linear-gradient(135deg,#1e40af,#3b82f6)':'#0f1623';
    b.style.color=j===i?'#fff':'#94a3b8';
    b.style.border=j===i?'none':'1px solid rgba(255,255,255,.1)';
  });
  const t=TEMPLATES[i];
  document.getElementById('content').innerHTML=`
    <div class="card">
      <div class="tag tag-gold">${t.type}</div>
      <p style="font-size:.82rem;color:#64748b;margin-bottom:20px;">Example: ${t.eg}</p>
      <h3 style="color:#60a5fa;margin-bottom:6px;">Listing Title Template:</h3>
      <div style="background:#070c18;border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:14px;margin-bottom:20px;font-size:.88rem;color:#e2e8f0;line-height:1.6;">${t.t}</div>
      <h3 style="color:#60a5fa;margin-bottom:6px;">Description Template:</h3>
      <div style="background:#070c18;border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:14px;font-size:.85rem;color:#cbd5e1;line-height:1.8;">${t.d}</div>
      <button onclick="copyText(this,${JSON.stringify(t.t+'\n\n'+t.d)})" class="btn btn-blue" style="margin-top:16px;width:100%;">Copy Title + Description</button>
    </div>
    <p style="margin-top:16px;color:#475569;font-size:.78rem;">Replace all [brackets] with your domain-specific information. See Module 3 for the 7-element formula behind these templates.</p>
  `;
}
function copyText(btn,text){navigator.clipboard.writeText(text).then(()=>{btn.textContent='Copied!';setTimeout(()=>btn.textContent='Copy Title + Description',2000);});}
showTab(0);
</script><footer><p>Flip And Close &copy; 2026 &middot; <a href="mailto:support@nicelysupport.com" style="color:#3b82f6;">support@nicelysupport.com</a></p></footer></body></html>
